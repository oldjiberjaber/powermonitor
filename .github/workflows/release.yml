name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware with PlatformIO
        run: |
          pio run -e esp32-s3-devkitc-1

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin release_assets/powermonitor-firmware-${{ github.ref_name }}.bin
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin release_assets/bootloader-${{ github.ref_name }}.bin
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin release_assets/partitions-${{ github.ref_name }}.bin

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/powermonitor-firmware-${{ github.ref_name }}.bin
            release_assets/bootloader-${{ github.ref_name }}.bin
            release_assets/partitions-${{ github.ref_name }}.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
